name: cloud-service

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/cloud
      DB_USER: cloud
      DB_PASSWORD: cloud
      STORAGE_DIR: /data/files
    volumes:
      - file-data:/data/files
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  file-data:
